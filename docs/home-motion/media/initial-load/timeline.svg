<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="white"/><g font-family="Arial,sans-serif" fill="#242429"><text x="24" y="34" font-size="22" font-weight="bold">Начальная загрузка · время от T</text><text x="24" y="62" font-size="14">T — контент готов. До T шиммер повторяется столько времени, сколько задаёт приложение.</text><text x="24" y="127" font-size="15">Скелетоны → контент</text><rect x="320.0" y="108" width="110.0" height="28" rx="4" fill="#038F5D"/><text x="325.0" y="126" fill="white" font-size="12">0–220 мс</text><text x="24" y="175" font-size="15">Большой кешбэк</text><rect x="320.0" y="156" width="150.0" height="28" rx="4" fill="#038F5D"/><text x="325.0" y="174" fill="white" font-size="12">0–300 мс</text><text x="24" y="223" font-size="15">Кешбэк: 116 → 68 px</text><rect x="470.0" y="204" width="200.0" height="28" rx="4" fill="#038F5D"/><text x="475.0" y="222" fill="white" font-size="12">300–700 мс</text><text x="24" y="271" font-size="15">Приглашение: 0 → 1, 90 → 100%</text><rect x="670.0" y="252" width="150.0" height="28" rx="4" fill="#038F5D"/><text x="675.0" y="270" fill="white" font-size="12">700–1000 мс</text><text x="24" y="319" font-size="15">Наклон: 0° → −10°</text><rect x="820.0" y="300" width="140.0" height="28" rx="4" fill="#038F5D"/><text x="825.0" y="318" fill="white" font-size="12">1000–1280 мс</text><text x="24" y="378" font-size="14">Уменьшение → появление → поворот: каждый следующий этап ждёт завершения предыдущего.</text></g></svg>